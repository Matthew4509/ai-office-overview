<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Office Overview</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="app.css">
</head>
<body>
<header class="top">
  <h1><a href="/" id="home" title="Back to the office with all projects">AI Office Overview</a></h1>
  <div class="top-right">
    <button type="button" id="purse" class="chip purse" hidden></button>
    <div class="theme-switch" role="radiogroup" aria-label="Colours">
      <button type="button" role="radio" aria-checked="false" data-theme-pick="light" title="Light" aria-label="Light"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.4M12 19.1v2.4M2.5 12h2.4M19.1 12h2.4M5.3 5.3l1.7 1.7M17 17l1.7 1.7M5.3 18.7 7 17M17 7l1.7-1.7"/></svg></button>
      <button type="button" role="radio" aria-checked="false" data-theme-pick="dark" title="Dark" aria-label="Dark"><svg viewBox="0 0 24 24" aria-hidden="true"><path class="fill" d="M19.5 14.6A8 8 0 0 1 9.4 4.5a8 8 0 1 0 10.1 10.1z"/></svg></button>
      <button type="button" role="radio" aria-checked="false" data-theme-pick="auto" title="Auto: light from sunrise to sunset, dark at night" aria-label="Auto, by sunrise and sunset"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9.5" cy="12" r="3.2"/><path d="M9.5 5.2v1.6M9.5 17.2v1.6M2.7 12h1.6M4.7 7.2l1.1 1.1M4.7 16.8l1.1-1.1"/><path class="fill" d="M13.5 3.2a8.8 8.8 0 0 1 0 17.6a10.5 10.5 0 0 0 0-17.6z"/></svg></button>
    </div>
    <button type="button" id="open-setup" class="chip">Setup</button>
  </div>
</header>
<div id="loading" class="loading" role="status" hidden><span id="loading-words"></span> <progress id="loading-bar" max="1" value="0"></progress></div>
<div class="layout">
  <nav id="projects" class="filter" aria-labelledby="filter-title"></nav>
  <main class="middle">
    <div class="view-tabs" role="tablist" aria-label="How to show the staff">
      <button type="button" role="tab" id="tab-office" aria-selected="true">Office</button>
      <button type="button" role="tab" id="tab-list" aria-selected="false">List</button>
      <button type="button" role="tab" id="tab-favs" aria-selected="false">Favourites</button>
    </div>
    <div id="view-ticks" class="name-ticks" role="group" aria-label="What the office shows"></div>
    <section id="office-view" aria-label="The office">
      <div id="office"></div>
    </section>
    <section id="list-view" aria-label="Everyone" hidden></section>
    <section id="favs-view" aria-label="Favourites" hidden></section>
  </main>
  <aside class="side" id="side">
    <div class="side-tabs" role="tablist" aria-label="Right panel">
      <button type="button" role="tab" id="tab-needs" aria-selected="true" aria-controls="side-needs">Needs attention</button>
      <button type="button" role="tab" id="tab-rewards" aria-selected="false" aria-controls="side-rewards">Staff rewards</button>
    </div>
    <div id="side-needs" role="tabpanel" aria-labelledby="tab-needs"></div>
    <div id="side-rewards" role="tabpanel" aria-labelledby="tab-rewards" hidden></div>
    <div id="side-card" aria-live="polite" hidden></div>
  </aside>
</div>
<div id="setup" class="sheet" hidden></div>
<div id="edit" class="sheet" hidden></div>
<p id="fault" class="fault" role="alert" hidden></p>
<script src="sun.js"></script>
<script src="look.js"></script>
<script src="banter.js"></script>
<script src="office.js"></script>
<script src="app.js"></script>
<script src="setup.js"></script>
</body>
</html>
